# application.yml
server:
  port: 9000
spring:
  application:
    name: Widdo Nexus Framework - nexus examples
widdo:
  nexus:
    exception:
      include-stacktrace: false
    scan:
      base-packages:
        - com.widdo.nexus.examples.repository
    graph:
      database:
        type: NEO4J
        name: neo4j1
      neo4j:
        uri: bolt://widdo-neo4j:7687
        username: neo4j
        password: widdo_neo4j
        pool:
          max-connection-lifetime: 50
          connection-acquisition-timeout: 30
      execution:
        max-retries: 3
        retry-enabled: true
        retry-delay-ms: 1000
        slow-query-threshold-ms: 500
    hadoop:
      database:
        type: HDFS
      hdfs:
        username: hadoop
        nn:
          #NameNode Web
          web-addr: http://hadoop102:9870
          #NameNode内部服务端口
          inside-addr: hdfs://hadoop102:9820
    logging:
      enable-query-logging: true
      enable-performance-logging: true
      enable-transaction-logging: true
      level: debug
    query-locations:
      - classpath:custom-queries/*.yml
      - file:/etc/nexus/queries.yml
    enabled: true

logging:
  level:
    com.widdo.nexus: DEBUG
    com.widdo.nexus.core.query: TRACE
  pattern:
    console: "%magenta(%d{yyyy-MM-dd HH:mm:ss.SSS}) %yellow([%thread]) %highlight(%-5level) %green(%class.%method:%line) [%X{queryId}] - %msg%n"

#banner中打印的模板信息
info:
  app:
    name: ${spring.application.name}
    description: "@project.description@"
    version: "@project.version@"